version: '3.8'

services:
  company_web:
    build:
      context: .
      dockerfile: Dockerfile
    image: lamviec360-company-web:local
    container_name: lamviec360-company-web-local
    ports:
      - "3002:3002"
    volumes:
      # Mount source code for hot-reloading
      - .:/app
      # Prevent host node_modules and .next from overriding container directories
      - /app/node_modules
      - /app/.next
    # Use dev server for local development instead of production start
    command: npm run dev
    restart: unless-stopped
